[project]
name = "fatask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "faststream[aiokafka,kafka]>=0.7.7",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "passlib[argon2,bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."] 
